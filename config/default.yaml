# Pitch geometry — FIFA standard for v1.
pitch:
  length_m: 105.0
  width_m: 68.0
  goal_height_m: 2.44
  # FIFA inside post-to-post; used by goal_impact ball anchor to locate
  # the posts at y = width_m/2 ± goal_width_m/2 along each goal line.
  goal_width_m: 7.32
  # Approximate goal depth — used to model the back_net and side_net
  # as flat vertical planes behind / beside the goal frame for the
  # goal_impact pixel-ray intersection.
  goal_depth_m: 1.5
  corner_flag_height_m: 1.5

prepare_shots:
  expected_format: mp4
  output_fps: null
  # auto  : split single inputs >= split.min_input_duration_s, else copy
  # copy  : always treat inputs as pre-trimmed clips (legacy behaviour)
  # split : always run highlights-reel ingestion on a single video input
  mode: auto
  split:
    min_input_duration_s: 90
    # adaptive tolerates broadcast pans/zooms better; content is the
    # simple frame-diff threshold detector (better on synthetic/clean
    # footage).
    detector: adaptive
    threshold: 27.0
    adaptive_threshold: 3.0
    adaptive_min_content_val: 15.0
    min_scene_len_frames: 13
    # Sub-second fragments are useless for reconstruction; very short
    # neighbours are merged first (false cuts from whip pans), then
    # anything still under min_shot_duration_s is dropped. Kept at 0.6 s
    # so spike-rescued real cuts (rapid celebration cutting) don't
    # re-fuse with their neighbours.
    min_shot_duration_s: 1.0
    merge_max_gap_s: 0.08
    merge_short_shots_max_duration_s: 0.6
    # Frame-diff outlier rescue: unions statistically violent cuts the
    # adaptive detector misses inside continuous fast action (see
    # src/utils/shot_split.py docstring — 28/36 -> 36/36 confirmed cuts
    # on the Liverpool test reel).
    spike_rescue:
      enabled: true
      z_min: 4.0
      abs_min: 18.0
      window_frames: 25
    # Cross-dissolve splitting (fades between clips, montage intros):
    # sustained frame-diff with near-zero optical flow. Pans carry real
    # flow and are rejected (Liverpool reel: dissolves at flow 1.0-1.2,
    # pans 1.4-8.6).
    dissolve_split:
      enabled: true
      # Block-median frame change: a fade alters every block equally
      # (>= ~10); static-camera action only alters player blocks (<= ~7).
      uniformity_min: 10.0
      flow_max: 1.25
      min_run_frames: 5
      # Fade frames (plus this margin either side) belong to NO shot —
      # extracted clips never start or end with blend artifacts.
      fade_trim_margin_frames: 2
  classify:
    sample_points: [0.15, 0.3, 0.5, 0.7, 0.85]
    # A shot is a crowd/bench "reaction" when the green-pitch fraction
    # stays below these (median / peak over the sampled frames).
    reaction_max_median_pitch_ratio: 0.12
    reaction_max_peak_pitch_ratio: 0.20
    # Scale bands on median pitch ratio (camera-distance proxy).
    wide_min_pitch_ratio: 0.40
    tight_max_pitch_ratio: 0.22
    # Fade-to-black transition detection. Real fades/wipes are short —
    # longer spans that merely sample one dark frame stay gameplay.
    fade_black_frame_threshold: 0.18
    fade_min_brightness_range: 0.25
    transition_max_duration_s: 2.0
    # Shots whose zoom-invariant motion rate is this many times slower
    # than the live-shot reference are replays (and get retimed to real
    # time at extraction).
    replay_min_speed_factor: 1.25
    # Player close-up discard (celebration close-ups): a shot whose
    # tallest person's median height fraction exceeds the threshold is
    # excluded as 'closeup'. Bournemouth GT: the operator KEEPS medium
    # replay shots up to ~0.74; celebration close-ups sit higher. Shots
    # with pitch but ZERO detected persons drop as 'ambient'. Stage
    # default is off (tests/light envs); this config turns it on.
    closeup_max_person_height: 0.78
    person_check:
      enabled: true
      model: yolov8n.pt
      confidence: 0.35
  group:
    # One group per attack passage: a new group starts at each long
    # wide live shot (small players = true wide framing). Derived from
    # the Bournemouth GT: group-initial shots are >= 6 s with person
    # height <= 0.19; replays are shorter/closer. Hard-cut
    # continuations (gap ~0) never start a group.
    live_wide_max_person_height: 0.25
    live_wide_min_duration_s: 5.7
    continuation_max_gap_s: 0.1
  align:
    enabled: true
    curve_width_px: 192
    smooth_sigma_frames: 2.0
    min_overlap_s: 1.0
    # NCC peaks below this are recorded as low_confidence with an
    # align-ends fallback offset instead.
    min_confidence: 0.5

tracking:
  player_model: yolov8x.pt
  ball_model: yolov8n.pt
  confidence_threshold: 0.3
  # YOLO NMS IoU threshold. Raised from the ultralytics default of 0.7
  # because two footballers running close together overlap at IoU
  # 0.5-0.8 and the default silently drops one — the tracker then sees
  # one bbox covering two players, which is the dominant cause of ID
  # swaps during occlusions. 0.85 lets both detections survive while
  # still suppressing duplicate proposals for a single player.
  iou_threshold: 0.85
  # YOLO inference resolution (longest-side). With sahi.enabled this is
  # the per-tile resolution; with sahi disabled it's the whole-frame
  # resolution. 1280 on a 960-px tile is a 1.33x bilinear upscale,
  # which is the sweet spot for anchor density without huge cost.
  imgsz: 1280

  # SAHI-style tiled inference. Each frame is split into overlapping
  # 960-px tiles and YOLO runs on each one separately. Detections are
  # then NMS-merged back into full-frame coordinates. On 1920x1080
  # broadcast footage this gives a 3x2 tile grid with 240 px of
  # overlap, so any player straddling a tile seam is fully detected in
  # at least one neighbouring tile. The point isn't more pixels — it's
  # giving each region of the frame its own fresh anchor lattice,
  # which is what separates two close players that single-pass
  # inference at any imgsz still collapses into one bbox.
  sahi:
    enabled: true
    tile_size: 960
    overlap_ratio: 0.25
    # NMS IoU at which two detections from neighbouring tiles are
    # considered duplicates of the same player and the lower-confidence
    # one is dropped during merge.
    nms_iou_threshold: 0.5
  team_classifier: none
  default_team_label: unknown
  progress_every_frames: 150
  # Default max gap (in missing frames) the dashboard's "Interp Missing
  # Frames" button will linear-interpolate between two known bboxes
  # inside a track. Picked so the operator can fill brief detector
  # dropouts (≈0.25 s at 30 fps) without straying into gaps long enough
  # for direction changes to make linear interp give wrong crops.
  # Set to 0 to disable the button by default (it can still be overridden
  # per-request).
  interpolate_max_gap_frames: 8
  # Tracker selection: `bytetrack` (motion/IoU only — supervision's
  # default) or `botsort` (BoxMOT BoT-SORT with OSNet ReID embeddings).
  # botsort holds IDs through occlusions when players cross because it
  # weighs appearance alongside IoU; bytetrack is faster but swaps IDs
  # at collisions, especially between players in clashing kits.
  tracker: botsort
  # Path to the OSNet ReID checkpoint. Fetch with scripts/setup_boxmot.sh.
  # Only used when tracker == botsort.
  # OSNet-AIN (Adaptive Instance Normalisation) at x1.0 capacity. Far
  # more robust on football broadcast footage than osnet_x0_25 — AIN
  # handles the domain shift from the surveillance dataset OSNet was
  # trained on (MSMT17) to broadcast sport, and x1.0 is 4x the capacity
  # of x0.25 so embedding distance between visually different players
  # is much sharper. Fetch with scripts/setup_boxmot.sh.
  reid_weights: third_party/boxmot/osnet_ain_x1_0_msmt17.pt
  # Device for the ReID network. `auto` picks CUDA if available, else
  # MPS (Apple Silicon), else CPU. Pin explicitly with cuda / mps / cpu
  # when you want predictable performance.
  tracker_device: auto
  # BoT-SORT tuning knobs. Defaults follow BoxMOT's recommended values
  # for sports tracking; the appearance weight (proximity_thresh /
  # appearance_thresh) is what actually disambiguates a collision.
  botsort:
    track_high_thresh: 0.5      # detections above this start new tracks
    track_low_thresh: 0.1       # below this they're discarded
    new_track_thresh: 0.6       # confidence required to mint a new ID
    match_thresh: 0.8           # max cost for IoU re-association
    proximity_thresh: 0.5       # max IoU distance before ReID kicks in
    # Tightened from 0.25 -> 0.15: only accept genuinely-close appearance
    # matches. Players in clashing kits should sit well above 0.15 cosine
    # distance, so this rejects swap candidates while keeping legitimate
    # re-acquisitions of the same player.
    appearance_thresh: 0.15
    # sof (sparse optical flow) is more robust than ECC on panning
    # broadcast cameras where the pitch dominates the frame — ECC's
    # whole-frame correlation gets confused by the uniform pitch
    # texture. Options: ecc | orb | sift | sof.
    cmc_method: sof
    frame_rate: 30
    fuse_first_associate: false
    with_reid: true

camera:
  first_anchor_min_landmarks: 6
  subsequent_anchor_min_landmarks: 4
  # Tightened from 10.0 once lens-distortion modelling and Huber loss were
  # added — anchors above this px residual surface as low-confidence in the
  # quality report (soft threshold, not a hard fail).
  anchor_max_reprojection_px: 2.0
  # Stadium-mounted broadcast cameras don't translate — only pan, tilt,
  # zoom. Locking t prevents the LM from finding K/R/t combinations that
  # reproject anchors well but jump the camera body around in pitch
  # metres between anchors. Set false for moving rigs (steadicam, dolly).
  static_camera: true
  # Lens model: when true, the camera stage runs a 9-DOF LM (rvec, tvec,
  # fx, cx, cy, k1, k2) on the highest-coverage anchor (≥10 landmarks,
  # ≥12% image-area span) to recover principal point and radial
  # distortion before the joint solve. Without this, principal point is
  # pinned to image centre and distortion is estimated jointly across
  # anchors — which gets rejected on real clips because click noise
  # outweighs the distortion signal. With this enabled, the lens prior
  # is recovered from the one anchor that has enough spatial coverage
  # to disambiguate it from pose, and every other anchor inherits it.
  # The estimator self-gates (returns None if it can't beat the no-
  # distortion baseline by 2×), so leaving this on is safe when no
  # qualifying anchor exists — the legacy flow runs instead.
  lens_from_anchor: true
  # Line extraction (experimental): when true, the camera stage adds a
  # post-propagation pass that re-fits the per-frame cameras against
  # painted pitch lines detected directly in the video frame. Each
  # propagated camera is the detection bootstrap; the detector searches
  # a strip around each projected catalogue line, locates the painted
  # line's sub-pixel centreline (bright-ridge convolution + parabolic
  # peak), and an LM re-solves against those lines.
  # With static_camera=true the camera stage runs the static-camera line
  # solve: detect -> C-profile -> bundle-adjust one shared camera centre
  # -> iteratively re-detect. The output track has a single fixed
  # camera_centre (zero body motion). With static_camera=false it runs
  # the legacy independent per-frame line refinement instead (per-frame
  # solves are locally under-determined and the body can wander).
  # See docs/superpowers/notes/2026-05-14-camera-1px-experiment.md.
  line_extraction: true
  line_extraction_strip_px: 25       # search-strip half-width (px) around projected line
  line_extraction_min_gradient: 10.0 # min bright-ridge contrast (grey levels) to accept a line
  line_extraction_max_iters: 4       # detect↔solve iterations per frame (static_camera=false path)
  # Lens model for the static-camera line solve (only used when
  # static_camera + line_extraction are both true). pinhole_k1k2 shares
  # (cx, cy, k1, k2); brown_conrady additionally frees tangential
  # (p1, p2) and k3. Start with pinhole_k1k2 — the C-profile diagnostic
  # (scripts/profile_static_c.py) tells you whether the richer model is
  # needed. See docs/superpowers/notes/2026-05-14-camera-1px-experiment.md.
  line_extraction_lens_model: pinhole_k1k2
  # Iterative rounds for the static-camera line solve: detect → solve →
  # re-detect under the solved cameras → re-solve. Default 1 — on gberch
  # the extra rounds regressed (re-detecting under the shared static-C
  # camera finds more but noisier lines) and the solve keeps the best
  # round anyway, so >1 only costs runtime. Raise per-clip if a clip's
  # propagated bootstrap cameras are poor enough that re-detection helps.
  line_extraction_static_rounds: 1
  # Minimum detected painted lines for a frame's per-frame static-C solve to
  # be trusted. A per-frame solve recovers 4 DOF (rotation + focal); with
  # fewer than this many lines (often near-parallel touchlines) the solve is
  # under-determined and can yield non-physical cameras (extreme focal,
  # rotation flips) that still fit the few lines. Frames below this keep the
  # smooth interpolated camera instead. Lower it if a clip is line-poor and
  # you would rather have noisier per-frame solves than more interpolation.
  line_extraction_min_lines_per_frame: 4
  # Per-detection acceptance gates for the static-line solve. min_n_samples is
  # the number of perpendicular cross-sections a detected line must have; 40 is
  # ~120px of line, which rejects short far-side lines (e.g. far_touchline).
  # Lower it (e.g. 20) to admit shorter lines and improve solve conditioning on
  # clips dominated by near-parallel near-side lines.
  line_extraction_det_min_n_samples: 40
  line_extraction_det_min_confidence: 0.5
  # Temporal smoothing window for the final per-frame (rotation, focal)
  # trajectory after the static-line solve. 0 disables it. ~7-11 removes the
  # seam steps where line-solved frames meet interpolated gap frames.
  line_extraction_smooth_window: 9        # adaptive rotation smoothing window (0 disables)
  line_extraction_smooth_iters: 4         # pin-and-smooth relaxation passes (line-solved frames pinned, interp relaxed)
  # Clip-adaptive detection bootstrap. The static-line solve normally bootstraps
  # detection from the anchor-interpolated camera. On clips where the anchors
  # are sparse/partial (PnLCalib only cold-started part of the clip), that
  # bootstrap is off by more than the search strip and detection finds nothing
  # even though lines are visible. When line-detected coverage falls below
  # _min_coverage, re-bootstrap detection from PnLCalib's accurate per-frame
  # camera instead. gberch's coverage is ~100% so this never triggers there
  # (its path is unchanged); origi/kroupi benefit.
  line_extraction_pnlcalib_bootstrap: true
  line_extraction_pnlcalib_bootstrap_min_coverage: 0.5
  # Centre-circle rescue: frames the straight-line filter drops (too few lines —
  # e.g. midfield where the box is out of view) but where the centre circle is
  # visible are rescued by detecting the circle and adding it as a weighted
  # point constraint. Only dropped frames are rescued, so well-lined clips
  # (gberch) are unchanged.
  # Off by default: as currently tuned the circle constraint trades straight-
  # line fit for circle fit and regresses the line-RMS metric on midfield-heavy
  # clips (origi01: mean 3.1 -> 5.0px). Enable to experiment; needs circle_weight
  # tuning to be a clear win. Camera stays smooth either way.
  line_extraction_detect_circle: false
  line_extraction_circle_lens: true     # centre-circle ellipse pins global lens (distortion+principal point) on wide/midfield shots
  line_extraction_circle_lens_min_misfit: 5.0   # px; only refine lens when circle this mis-fit (gberch's fits -> skipped)
  line_extraction_circle_lens_min_frames: 4
  line_extraction_circle_ellipse_band: 50.0
  line_extraction_circle_lens_weight: 1.0
  line_extraction_circle_min_lines: 2     # need >=this many straight lines too
  line_extraction_circle_points: 20       # circle samples fed to the solve
  line_extraction_circle_weight: 0.3      # residual weight vs straight lines
  # Coverage extension: solve frames beyond the anchor span where PnLCalib
  # gives a plausible camera and lines are detectable (e.g. clip tails). Only
  # adds frames; full-coverage clips are unaffected.
  line_extraction_extend_coverage: true
  line_extraction_extend_max_rms: 4.0     # px; reject extended frames above this
  # Propagating coverage extension: fill uncovered frames by seeding each from
  # its covered neighbour (static camera -> locked C applies). Sweeps outward;
  # reaches spans PnLCalib never cold-started. gberch is full -> no-op.
  line_extraction_propagate_coverage: true
  # Frames the static bundle skipped (too few straight lines) keep rotations
  # solved under the PRE-bundle geometry; re-deriving t against the bundle's C
  # silently shifts their projections (origi01 midfield: ~330 px off the
  # user's clicks). Demote them to uncovered so propagation re-solves them
  # against their own lines (+ circle) at the locked geometry; anything
  # unsolvable is SLERP-filled between solved neighbours. gberch: no-op.
  line_extraction_resolve_underlined: true
  # Advertising-hoarding base line: a static scene line parallel to the far
  # touchline (one lateral offset per clip; height fixed to 0 — with a static
  # camera centre the (offset, height) family is projectively equivalent).
  # Calibrated per clip from anchor/bundle frames, then injected as a line
  # constraint into propagation / cold-start solves and the stored detections
  # (so the lens refinement and outlier passes see it). The boards are the
  # strongest feature in exactly the far field where pitch lines are starved.
  # Clips whose boards are out of view (gberch) fail calibration -> no-op.
  line_extraction_board_line: true
  # Anchor frames among the demoted are re-solved IN PLACE from their landmark
  # points (PnLCalib/manual) at the locked geometry — solved islands inside
  # feature-poor spans that propagation then fills between. Reject above this
  # point-reprojection rms (PnLCalib keypoint noise is ~5-15 px).
  line_extraction_anchor_resolve_max_rms: 30.0
  line_extraction_cold_start: true            # orientation-sweep cold-start for the uncovered (wide) start of clips
  line_extraction_cold_start_max_rms: 12.0     # accept lens-limited wide-field rms (the lens refinement then fixes it)
  # Circle-aided start frames gate on the MEDIAN residual, dominated by global
  # lens error across the circle's arc while the wide start is still solved
  # under the box-derived lens (origi01: 13-37 px). The circle-lens refinement
  # + post-lens re-solve correct accepted frames afterwards.
  line_extraction_cold_start_circle_max_rms: 40.0
  line_extraction_cold_start_min_lines: 3
  line_extraction_cold_start_max_dev_deg: 25.0 # reject cold-starts more than this far from the covered boundary
  line_extraction_propagate_passes: 4
  line_extraction_propagate_max_bridge: 8   # jump feature-poor barriers up to this many frames
  line_extraction_propagate_min_lines: 2     # seed prior + rms gate + outlier rejection make 2 perpendicular lines safe
  # Per-frame centre circle during propagation/re-solve — consulted ONLY on
  # line-sparse frames (< min_lines_per_frame straight lines), where it is the
  # constraint that disambiguates a parallel line pair (origi01's midfield /
  # start). Well-lined frames solve from lines alone, so the historical
  # line-RMS regression (circle trading away straight-line fit) cannot recur.
  line_extraction_propagate_circle: true
  # Outlier rejection: frames whose per-frame line-RMS exceeds max(abs, rel x
  # clip-median) are bad per-frame solves; replace them with neighbour
  # interpolation. abs=8px keeps gberch's well-fit frames untouched.
  line_extraction_outlier_rejection: true
  line_extraction_outlier_rot_deg: 2.0    # rotation-jump vs neighbour SLERP
  line_extraction_outlier_passes: 6       # iterate to bridge multi-frame seam blocks
  line_extraction_outlier_max_rms: 8.0
  line_extraction_outlier_rel: 3.0
  # ORB is the only detector currently implemented in feature_propagator.
  # SuperPoint is a future enhancement (better repeatability under zoom).
  feature_detector: orb
  max_features_per_frame: 1000
  ransac_inlier_min_ratio: 0.4
  redetect_threshold: 200
  enable_bidirectional: true
  pitch_line_consistency_max_px: 5.0
  forward_backward_disagreement_warn_deg: 0.5
  # Landmark-free cold-start via the vendored PnLCalib model. On by default:
  # the camera stage auto-generates anchors and writes {shot}_anchors.json
  # before the normal solve. With mode: replace_when_empty this ONLY runs for
  # shots that have no manual anchors, so hand-placed anchors always take
  # precedence; un-anchored shots (previously skipped) now get a PnLCalib
  # cold-start. First use downloads ~500MB of weights to data/models/pnlcalib/.
  # Set enabled: false to restore manual-only anchoring. mode:
  #   replace_when_empty - only auto-generate when no manual anchors exist
  #   augment            - union auto anchors with existing manual ones
  #   force              - always regenerate (overwrites manual)
  auto_anchors:
    enabled: true
    mode: replace_when_empty
    # Denser keyframes (interval 18 / up to 24 anchors) keep the per-frame
    # bootstrap accurate across the whole clip so the strict line detector
    # finds lines on every frame (no interpolation gaps). Validated on gberch:
    # 0-line frames 145 -> 0, max per-frame rotation jitter 5.3° -> 0.3°.
    keyframe_interval: 18
    max_keyframes: 24
    min_points_per_anchor: 4
    consensus_max_position_mad: 4.0
    # Snap each PnLCalib keypoint to its sub-pixel painted-line intersection
    # before it becomes an anchor, to cut PnLCalib's ~4-5px point noise.
    # line_intersection mode only moves a keypoint when two roughly-
    # perpendicular lines are found; spots/occluded corners keep their estimate.
    snap_keypoints: false
    snap_window_px: 30
    snap_min_confidence: 0.5
    plausibility_bounds:
      x: [-30.0, 135.0]
      y: [-60.0, 130.0]
      z: [3.0, 80.0]
    model:
      device: auto          # auto -> cuda on the Linux box, cpu/mps on Mac
      kp_threshold: 0.3434
      line_threshold: 0.7867

hmr_world:
  # Force CPU on macOS: GVHMR's RoPE attention has a slice op that
  # trips an MPS assertion (dimension[1] (120) ... subRange) at exactly
  # the model's configured max_len. CPU is slower but stable.
  device: cpu
  # Device for ViTPose+HMR2 feature extraction only — the GVHMR transformer
  # itself still runs on `device` above. auto|mps|cpu; auto = mps on Apple
  # Silicon when available, else cpu (and never splits when `device` is cuda).
  # Default auto since 2026-08-29: measured 3.3-4.3x per-player on gberch
  # P012/P014 with all required parity metrics passing at 100-1000x margin
  # and zero MPS fallbacks (scripts/bench_gvhmr_inference.py --compare-against).
  extractor_device: auto
  checkpoint: third_party/gvhmr/inputs/checkpoints/gvhmr/gvhmr_siga24_release.ckpt
  batch_size: 16
  max_sequence_length: 120
  min_track_frames: 10
  beta_aggregation: median
  theta_savgol_window: 11
  theta_savgol_order: 2
  ground_snap_velocity: 0.1
  foot_anchor_max_occlusion_frames: 10
  # Translation-jitter dampener — smooths root_t across time. The same
  # camera-tracking jitter that drives ~mm pose drift also reaches root_t
  # via the foot-anchor ray-cast; a 5-frame Savgol kills the noise without
  # flattening sprint accelerations. Set window=1 to disable.
  root_t_savgol_window: 5
  root_t_savgol_order: 2
  # Constant tilt-correction (degrees) for monocular-HMR's
  # lean-away-from-camera bias. Rotates root_R_pitch around the horizontal
  # axis perpendicular to the camera-to-player direction by this many
  # degrees toward the camera. 0 disables; 5 is a good empirical starting
  # point on broadcast clips.
  lean_correction_deg: 5.0
  # Root-translation anchoring strategy. contact = per-foot ray-cast
  # stance detection pins the planted foot and carries a smooth delta
  # correction over the legacy ankle-mid carrier (fixes sliding).
  # ankle_mid = legacy canonical-offset ankle-midpoint ray-cast, kept
  # for bit-parity fallback.
  anchor_mode: contact
  contact:
    # Ray-cast world speed (m/s) below which a foot is judged planted
    # (enter stance). Hysteresis pair with speed_exit_m_s below.
    speed_enter_m_s: 0.6
    # Ray-cast world speed (m/s) above which a planted foot is judged
    # to have left stance (exit hysteresis, always >= speed_enter_m_s).
    speed_exit_m_s: 1.2
    # Minimum contiguous frames for a stance span to be trusted —
    # filters single-frame kick-deceleration false positives. Raised
    # from 4 during Wave-4 gberch E2E tuning: on real (noisy) ViTPose
    # ankle tracks, 4-frame spans were disproportionately low-confidence
    # (ankle_conf ~0.3-0.5) and left a handful of single-frame speed
    # spikes (~0.6-1.3 m/s) right after touchdown inside otherwise-clean
    # spans, keeping p95 skate stubbornly at/above the 0.8 m/s gate.
    min_span_frames: 5
    # Max allowed spread (m) of in-span ray-casts around their median
    # pin; spans exceeding this (kicks, false stances) are rejected.
    # Tightened from 0.25 during Wave-4 gberch E2E tuning: real ankle
    # ray-casts are noisier than the synthetic-fixture tests exercise,
    # and 0.25 let through marginal, low-confidence spans (e.g. gberch
    # P001 frames 64-78, mean ankle_conf ~0.5, raw ray-cast spread
    # ~0.3-0.4 m) whose implied root position swung wildly frame to
    # frame despite passing the gate. 0.15 rejects those while still
    # accepting the genuinely-planted spans (which cluster near 0
    # spread) — see docs/superpowers/plans/2026-09-02-foot-contact-
    # locomotion.md Wave 4 report for the parameter sweep.
    max_pin_spread_m: 0.15
    # Assumed kp2d pixel jitter, scaled by the local px->m ground
    # scale to set a noise-adaptive speed floor so far/small players
    # don't produce spurious stance detections.
    px_noise: 2.0
    # Clamp on the stance-pin correction delta |root_stance -
    # root_carrier| (metres) applied to the dense carrier path. Raised
    # from 0.5 during Wave-4 gberch E2E tuning: a tight clamp doesn't
    # prevent a noisy implied root from swinging — it just saturates at
    # the clamp boundary for several frames then drops back below it,
    # which is WORSE than an unclamped swing (the saturate/release
    # transition is itself a sharp discontinuity in root_t, i.e. extra
    # sliding). 2.0 m accepts the full swing (still bounded — nothing
    # in gberch needed more) so the PCHIP interpolation stays smooth;
    # the max_pin_spread_m tightening above is what actually keeps bad
    # spans out, this clamp is now a last-resort safety net rather than
    # the primary defence.
    max_correction_m: 2.0
    # Time constant (s) over which the correction delta decays back
    # toward the legacy carrier on long no-contact spans (flight,
    # occlusion) rather than holding a stale pin offset.
    decay_s: 0.6

ball:
  # Detector backend used by the in-stage detection pass. wasb is the
  # purpose-built broadcast-sports detector (vendored at
  # third_party/wasb_sbdt). yolo is the COCO class-32 fallback. fake is
  # used only in tests via dependency injection.
  detector: wasb
  # Opt-in persistent detection cache: wraps the detector built above at
  # the detect/detect_candidates boundary with a frame-content-hash
  # cache (src/utils/ball_detection_cache.py), so a ball-stage re-run
  # (e.g. after editing anchors) replays stored detections instead of
  # re-running WASB inference. Cache key = frame content hash + a
  # detector fingerprint (checkpoint path/sha256/size, confidence,
  # input_size) so swapping the checkpoint or editing ball.wasb.* auto-
  # invalidates stale entries. Default off: first-run behaviour is
  # identical whether this is enabled or not. Cache files are gitignored
  # — never committed, never treated as model weights.
  detection_cache:
    enabled: false
    # Relative paths resolve against the run's --output dir; an absolute
    # path is used as-is.
    path: ball/detection_cache.json
  ball_radius_m: 0.11
  # Ball back-end: events | piecewise | global.
  #   events    (default) — resolve a sparse set of 3-D events (player
  #              touches body-pinned to the contacting joint, plus bounce/
  #              goal/rest waypoints), then render a DERIVED dense track via
  #              the reference interpolator; UE interpolates between events.
  #              See docs/superpowers/specs/2026-06-15-ball-touch-events-design.md.
  #   piecewise — the greedy event-classification + per-span physical solve
  #              (the dense monocular trajectory solver).
  #   global    — Phase-2 mode-sequence beam search; falls back to whole-shot
  #              piecewise on any failure or fit-budget overrun.
  solver: events
  # Beam mode-sequence search tuning (only consulted when solver: global).
  # Each field maps onto ModeSearchCfg in src/utils/ball_mode_search.py.
  mode_search:
    # Hypotheses retained at each breakpoint column.
    beam_width: 8
    # BIC-style parsimony cost added per segment (penalises over-segmentation).
    segment_cost_constant: 6.0
    # Cost for a mode transition with no supporting event.
    unexplained_break_penalty: 10.0
    # Cost for skipping a high-score breakpoint without a matching transition.
    ignored_event_penalty: 8.0
    # Per OBSERVED frame charged when OUT_OF_VIEW gaps a detection-rich span.
    out_of_view_frame_penalty: 1.5
    # Tiny per genuinely-missing frame charge so a long empty gap is not free.
    out_of_view_missing_frame_penalty: 0.05
    # Pixel tolerance for the soft tether to the possessing player's foot.
    possessed_tether_px: 40.0
    # Weight on |Δv| when scoring velocity continuity across a break.
    velocity_discontinuity_weight: 2.0
    # Hard fit-call budget; exceeding it falls back to whole-shot piecewise.
    max_segment_fit_calls: 20000
    # Max intermediate breakpoints a single segment may absorb (skip).
    max_skip: 3
  # Max consecutive frames the IMM tracker will gap-fill before emitting
  # state="missing". 6 ≈ 0.2 s at 30 fps.
  max_gap_frames: 6
  flight_max_residual_px: 5.0
  # C4: an airborne-anchored frame whose emitted world reprojects farther
  # than this from the user's clicked pixel is snapped onto the clicked ray
  # (keeping fitted depth). Makes the user's click authoritative for lateral.
  ray_faithful_tolerance_px: 3.0
  # Second-pass detection: frames with no accepted pass-1 detection are
  # revisited with low-threshold candidate detection, gated by a corridor
  # predicted from forward/backward IMM smoothing of pass-1 observations
  # only (second-pass output never steers its own corridor, and runs
  # exactly once). Accepted frames carry source="second_pass" in the
  # observations sidecar; they densify solver evidence but never mint
  # auto-anchors. zoom: when nothing clears the gate and the predicted
  # apparent ball diameter is below zoom_min_ball_px, a crop around the
  # corridor is re-detected (the detector's letterbox upscales it).
  second_pass:
    enabled: true
    candidate_min_score: 0.05
    top_k: 5
    corridor_sigma: 3.0
    accept_min: 0.25
    zoom_min_ball_px: 8.0
    zoom_crop_px: 320
    # Phase A (direction-change rework): revisit weak low-confidence pass-1
    # frames too, not just gaps — the zoom often sharpens a barely-detected
    # ball — replacing a pass-1 hit only when the zoom is strictly stronger.
    redetect_low_conf: true
    redetect_max_conf: 0.5
  # Phase B: direction-change segmentation. Corners of a robust piecewise
  # fit of the ball track are the touch/bounce candidates (replaces fragile
  # local velocity-break windows). max_residual_px is the piecewise-linear
  # fit budget — larger merges more aggressively (fewer, blunter corners).
  segment:
    enabled: true
    max_residual_px: 6.0
    # Track outlier rejection before segmentation: drop out-of-image
    # positions + isolated teleport spikes. max_jump_px is the per-frame
    # ball pixel-speed budget (scaled by frame gap).
    clean_track: true
    max_jump_px: 250.0
  # Foot-guided detection: zoom the detector around fast-moving player
  # contact joints to recover the ball at touches (WASB's global hit there
  # is often a confident false positive). A recovered ball-at-foot becomes a
  # touch directly. Only runs for re-detect-capable detectors (WASB/YOLO).
  # Re-enabled 2026-07-04 with fine-tuned detector v1 — measured gberch union
  # recall 0.250->0.500 alone; was disabled only because the stock detector
  # couldn't disambiguate the ball near feet. See the detection-rework spec.
  foot_guided:
    enabled: true
    min_foot_speed_px: 8.0      # gate: contact-joint pixel speed (a kick/contact)
    ball_near_foot_px: 45.0     # accept a zoomed ball within this of the foot
    min_score: 0.25
    nms_window_frames: 8        # temporal NMS: a touch is isolated, not every frame
  # Phase C: pose-anchored touch attribution. A direction-change break is
  # attributed to the nearest active body part within relaxed_radius_px,
  # ranked by a kinematic bonus (a fast-moving foot near the break is the
  # likely toucher). High recall — the editor prunes false positives.
  pose_touch:
    enabled: true
    relaxed_radius_px: 60.0
    kinematic_bonus_weight: 0.3
  kinematic_touch:
    enabled: true            # body-kinematics touch proposer (additive recall)
    contact_gap_m: 0.30      # max bone<->ball-ray 3-D gap for a contact (m)
    touch_relaxed_px: 60.0   # max bone<->ball pixel distance at the minimum
    max_ball_gap_frames: 6   # longest ball-pixel gap we interpolate across
    min_fk_conf: 0.3         # min bone FK confidence to consider
    kin_window: 2            # +/- frames to find the kinematic peak
    kin_min_foot_speed: 8.0  # min foot pixel-speed (px/frame) for a kick
    kin_min_head_speed_m: 0.05  # min head 3-D speed (m/frame) for a header
    confirm_window: 3        # +/- frames to look for a ball-pixel break
    nms_window: 2            # temporal NMS half-width (frames)
    w_gap: 0.35
    w_kin: 0.30
    w_confirm: 0.25
    w_fk: 0.10
    w_interp: 0.15
    min_emit_score: 0.25     # high-recall emission floor
  shot_chain:
    enabled: true              # auto-propose strike->impact chains from events
    pair_window_frames: 75     # max frames between strike touch and goal impact
    launch_speed_warn_min_m_s: 8.0   # warn band for implied speed between
    launch_speed_warn_max_m_s: 45.0  # consecutive chain knots (mis-click catch)
  context_prior:
    enabled: true
    drop_below: 0.35         # prior FACTOR at/below this => detection vetoed (confidences never scaled)
    pitch_margin_m: 5.0
    pitch_penalty: 0.7       # ground intersection far off-pitch (crowd/stand)
    player_max_dist_px: 180.0
    player_penalty: 0.75     # no tracked person box anywhere near the pixel
    static_window: 45
    static_max_px: 3.0
    static_min_cam_deg: 2.0
    static_penalty: 0.45     # pixel-static while the camera pans (overlay)
    min_factor: 0.1          # floor on the combined factor
  touch_attribution:
    enabled: true            # relabel touch events to the ray-closest joint. Re-enabled with detector v1 — relabelling now helps, gberch union 0.500->0.625; the earlier default-off measurement was pre-fine-tune.
    window: 2                # +/- frames around the event frame
    max_gap_m: 0.45          # candidates beyond this never relabel
    margin_m: 0.05           # required improvement over current attribution
    min_fk_conf: 0.3
  # Automatic anchoring (camera auto-anchor analogy): velocity breaks on
  # the pixel track are classified as player touches / bounces / goal
  # impacts using the players' FK contact joints and the goal geometry,
  # validated (contact gap vs the ball ray, on-pitch, reachability) and
  # merged with manual anchors. Manual anchors always win; auto anchors
  # within suppress_radius_frames of a manual one are dropped. Auto
  # anchors persist to {shot}_ball_anchors_auto.json for review.
  auto_anchors:
    enabled: true
    # Event detection (pixel units are px/frame).
    touch_max_px: 25.0
    min_direction_change_deg: 25.0
    min_speed_change_px: 4.0
    event_window_frames: 3
    merge_window_frames: 4
    # Goal impacts: post/crossbar need the ray within this distance of
    # the line; net hits additionally need the outbound speed to drop
    # below this fraction of the inbound speed.
    goal_line_tolerance_m: 0.35
    goal_net_speed_drop_ratio: 0.55
    # Anchor generation + validation.
    min_event_score: 0.25
    grounded_interval: 25
    grounded_min_conf: 0.55
    grounded_max_p_flight: 0.3
    contact_max_gap_m: 0.6
    shot_speed_px: 12.0
    suppress_radius_frames: 3
    # No grounded sampling for this long after a touch/bounce/impact —
    # the ball is likely airborne and the IMM posterior lags the launch.
    post_event_suppress_frames: 8
    # Evidence gate (sub-20cm campaign W2b): touch/bounce/goal events found
    # on a synthetic pixel track (anchor-interpolation / appearance-bridge /
    # gap-fill only) never become auto anchors — a mis-attributed body-pin
    # drags the track metres off a span plain interpolation gets right.
    # An event needs >= 1 real detector observation (detector/second_pass/
    # foot_guided) within +/- event_evidence_window frames. Grounded
    # sampling additionally accepts bridge/anchor-sourced observations.
    require_event_evidence: true
    event_evidence_window: 3
    # Reachability caps: ground-level anchor pairs use the rolling cap.
    max_speed_m_s: 45.0
    max_ground_speed_m_s: 35.0
  # Piecewise-physical solver: rolling friction cap, residual gates and
  # the bounce restitution envelope (violations are flagged in the
  # diagnostics/quality report, never silently corrected).
  physics:
    ground_z_tol_m: 0.35
    rolling_max_residual_px: 8.0
    rolling_decel_max_m_s2: 6.0
    # A roll faster than any ground pass is a lob in disguise.
    rolling_max_speed_m_s: 35.0
    max_splits_per_span: 3
    restitution_min: 0.5
    restitution_max: 0.85
    # Coulomb friction cap for the spin-aware bounce model
    # (ball_physics.bounce). Used by the coupled-bounce joint refit and
    # available for UE-side physically-correct bounce rendering.
    mu_max: 0.7
    # Longest credible single ballistic arc (bounds launch-arc searches);
    # open-span arcs whose apex stays below the minimum are ground passes.
    max_arc_seconds: 2.5
    open_span_min_apex_m: 0.5
  wasb:
    # Fine-tuned v1 (2026-07-04, ball_finetune_runs/run2/last.pth.tar: 30
    # epochs on the gberch/origi01/s013 gold+weak corpus, kroupi01 held
    # out). Coverage vs stock: origi01 0.36->0.92, origi02 0.51->0.62,
    # kroupi01 (holdout) 0.38->0.53, s013 0.27->0.99. Regenerate with
    # scripts/build_finetune_corpus.py + scripts/finetune_wasb.py.
    checkpoint: third_party/wasb_sbdt/pretrained_weights/wasb_soccer_finetuned_v1.pth.tar
    # checkpoint: third_party/wasb_sbdt/pretrained_weights/wasb_soccer_best.pth.tar  # stock fallback
    confidence: 0.3
    input_size: [512, 288]
    # Metal inference on the Mac (unset -> CPU, which makes dashboard runs
    # take hours; every sub-20cm campaign eval ran mps). The Linux GPU box
    # overrides to cuda.
    device: mps
  tracker:
    process_noise_grounded_px: 4.0
    process_noise_flight_px: 12.0
    measurement_noise_px: 2.0
    gating_sigma: 4.0
    # Replaces the old top-level ball.min_flight_frames / max_flight_frames.
    min_flight_frames: 6
    max_flight_frames: 90
  spin:
    enabled: true
    min_flight_seconds: 0.5
    # Magnus fit is only accepted if RMS pixel residual improves by at
    # least this fraction over the pure-parabola fit on the same segment.
    min_residual_improvement: 0.20
    # Relaxed acceptance threshold when the segment's start anchor
    # (kick/volley) carries an explicit spin preset — the user has
    # asserted there is spin, so we don't require the same 20 % beat.
    min_residual_improvement_with_hint: 0.05
    # Sanity bound on recovered angular speed (rad/s). ~15 rev/s is the top
    # of the real free-kick range; 95 rad/s (≈ 15.1 rev/s) enforces that.
    max_omega_rad_s: 95.0
    # Lumped drag coefficient k/m used inside the Magnus integrator:
    #     a = g + (k_drag_over_m) · (ω × v)
    drag_k_over_m: 0.005
    # Spin-coupled bounce joint refit (Phase 3 Task 5). When enabled, a
    # flight→flight bounce node attempts a single joint LM over both arcs'
    # initial state + the spin-aware bounce (e, μ), accepting only if the
    # combined pixel residual beats the two independent fits by the spin
    # improvement gate. DEFAULT FALSE: on a single broadcast camera the
    # 11-DOF joint fit is depth/spin degenerate — free (p0, v0) absorb the
    # weak Magnus signal and ω runs to the bounds even on spin-free
    # synthetics (validated in tests/test_ball_bounce_coupling.py). The
    # bounce() model itself is always available (UE-side use); only the
    # joint refit is gated off until a multi-view / replay-triangulated
    # constraint pins the arc depths. Flip to true only with that in place.
    bounce_coupling: false
  plausibility:
    z_max_m: 50.0
    horizontal_speed_max_m_s: 40.0
    pitch_margin_m: 5.0
  appearance_bridge:
    enabled: true
    max_gap_frames: 8
    template_size_px: 32
    search_radius_px: 64
    min_ncc: 0.6
    template_max_age_frames: 30
    template_update_confidence: 0.5
  # Cross-replay triangulation (Phase 1.5): when two shots in a sync group
  # are both processed, pair their detections through the saved sync offset,
  # optionally refine it by ray-miss minimisation (operator offsets are NEVER
  # overwritten — disagreements are flagged in the cross_replay diag), and
  # triangulate inlier pairs into 3D fixes that soft-constrain the LM flight
  # fitters. Shots without a synced partner take the pre-1.5 path (diag:
  # cross_replay: null). Disable with enabled: false to restore pre-1.5 output.
  cross_replay:
    enabled: true
    # Minimum detection confidence to include as a triangulation observation.
    min_conf: 0.3
    # Maximum midpoint-to-ray distance (metres) accepted as an inlier fix.
    max_ray_miss_m: 1.0
    # Minimum angular separation between the two rays (degrees). Below this
    # the pair has insufficient parallax and the triangulated depth is unreliable.
    min_parallax_deg: 8.0
    # Offset refinement search: scan +/- this many frames around the saved offset.
    offset_search_radius_frames: 4.0
    # Sub-frame step size for the refinement grid scan.
    offset_search_step: 0.25
    # Minimum inlier pairs required at the saved offset before refinement runs;
    # if fewer are found, the saved offset is kept unchanged.
    min_pairs_for_refine: 8
    # Weight of each 3D fix residual in the LM fitters (px per metre of 3D error).
    fix_weight_px_per_m: 30.0

refined_poses:
  # Ground-snap target height (m) for the in-contact foot joint above
  # the pitch plane. Historically applied to every frame's lower foot;
  # now contact-gated (only frames with an in-contact foot are snapped
  # — see foot_lock below and src/utils/foot_contact.py), so flight
  # phases keep their FK-consistent z.
  ground_snap_target_z: 0.02
  # Frames where the lower foot sits further than this (m) from the
  # ground are left alone rather than snapped (keeper dives, genuine
  # airborne moments outside a normal stance).
  ground_snap_max_distance: 0.30
  # Outlier rejection (per frame, per view) using MAD on root_t.
  outlier_k_sigma: 3.0
  min_contributing_views: 1
  high_disagreement_pos_m: 0.5
  high_disagreement_rot_rad: 0.5
  # Smoothing (reuses src/utils/temporal_smoothing.py).
  savgol_window: 7
  savgol_poly: 3
  smooth_rotations: true
  # Beta fusion across all shots a player appears in.
  beta_aggregation: weighted_mean
  beta_disagreement_warn: 0.3
  # Per-player robust translation cleanup. Runs first in the per-player
  # clean-up (after lean/ground-snap/trim, before the cross-player
  # consensus and the final smoother) so per-player teleports don't
  # corrupt the consensus median and the Savgol isn't fitting through
  # outliers. All thresholds are in physical units (m/s, metres,
  # seconds) so the same config generalises across clips and frame
  # rates. Targets two of the three jitter artifacts directly:
  # implausibly fast per-player motion and missing frames.
  cleanup:
    enabled: true
    # Gaps up to this many frames are filled by interpolation (linear
    # root_t/thetas, SLERP root_R). Longer gaps are left as keyframe
    # holds (the glTF LINEAR sampler bridges them) rather than
    # fabricating a multi-second straight-line glide.
    max_gap_fill_frames: 15
    # Hampel outlier test: a frame whose pitch-XY position deviates
    # from the local median (over this many seconds) by more than
    # max(hampel_k · 1.4826 · MAD, hampel_floor_m) is rejected and
    # re-interpolated from trusted neighbours.
    hampel_window_s: 0.4
    hampel_k: 3.0
    hampel_floor_m: 0.6
    # Biphasic ("out-and-back") velocity-spike rejection. Catches an
    # isolated root-translation pop too small in absolute displacement
    # to trip the Hampel position floor above, but whose frame-to-frame
    # velocity reverses direction within pop_max_reversal_frames frames
    # — the out-and-back signature of upstream hmr_world anchor/kp2d
    # noise. A frame's XY velocity is flagged (the "entering" leg) when
    # it deviates from the local median velocity (same ±hampel_window_s/2
    # window as the Hampel test, one derivative order up, computed
    # leave-out so the pop's own samples can't inflate the threshold
    # that judges them) by more than max(pop_k · 1.4826 · MAD,
    # pop_floor_m_per_frame) AND a later velocity (within
    # pop_max_reversal_frames, the "exiting" leg — which only needs to
    # clear the absolute floor, not independently out-MAD its own local
    # neighbourhood too) points substantially opposite (raw-velocity dot
    # product strongly negative). The reversal test — on raw velocity
    # direction, not on deviation from the local median — is what keeps
    # this safe: a sustained one-directional change (footstrike
    # deceleration, sprint start, direction cut) only changes velocity
    # MAGNITUDE along a roughly constant direction, so consecutive raw
    # velocities stay near-parallel and are never flagged, however large
    # the deviation from the local median. Flagged positions are
    # re-interpolated from trusted neighbours, same mechanism as the
    # Hampel test, and run before the velocity/acceleration limiters
    # below so a pop is repaired rather than merely capped.
    pop_k: 3.0
    pop_floor_m_per_frame: 0.12
    pop_max_reversal_frames: 2
    # Physical speed cap. Frame-to-frame displacement is limited to
    # v_max_m_s / fps metres (forward/backward, no lag). 12 m/s sits
    # safely above an elite sprint (~10 m/s) so genuine fast motion is
    # preserved while monocular depth wobble and tracking teleports are
    # reined in.
    v_max_m_s: 12.0
    # Physical XY acceleration cap. Frame-to-frame velocity CHANGE is
    # limited to a_max_m_s2 / fps² metres/frame² (forward/backward, no
    # lag). Catches isolated super-physical root-translation pops that
    # survive the Hampel test and the velocity cap above — brief 0.3-0.5 m
    # excursions coincident with upstream hmr_world anchor/kp2d noise
    # frames, registering as 100s of m/s² rather than a genuine sprint
    # direction change (real sprints stay under ~15 m/s²).
    # 75 m/s² is empirically tuned on gberch, not just "above the human
    # ceiling": a lower value closer to that ~15 m/s² ceiling (e.g. 40)
    # also clamps the legitimate, sharp velocity drop at a real footstrike
    # — the foot-lock finale downstream then can't fully re-pin the
    # affected stance span, INCREASING stance skate instead of reducing
    # it. 75 sits above the observed footstrike-adjacent jitter ceiling
    # (a stable safe zone from ~70-120 m/s² on gberch; spec §6's skate
    # gate regresses somewhere between 40-45) while still cutting the
    # measured pop signature materially (~20-35% off p99/max root
    # acceleration on gberch's three tracked players).
    a_max_m_s2: 75.0
  # Cross-player camera-jitter correction. Detects frames where every
  # visible player drifts in unison on the pitch and subtracts the
  # common XY shift. Runs per shot, between the per-player clean-up
  # (outlier reject / lean / ground snap / trim) and the per-player
  # temporal smoothing, so residual error is mopped up by Savgol.
  jitter:
    enabled: true
    # Need at least this many visible confident players' frame-to-
    # frame deltas before we trust the median as consensus.
    min_players: 4
    # Rolling window (seconds) over which the scene-tempo baseline
    # is computed. Larger → smoother baseline, slower to react to
    # genuine tempo changes.
    baseline_window_s: 1.0
    # Lower bound on the baseline so a perfectly static scene
    # doesn't make every tiny shift look like a multiple of zero.
    baseline_floor_m: 0.05
    # |median Δ| must exceed tempo_ratio × max(baseline,
    # baseline_floor) to trigger. 2.5 picks out spikes that clearly
    # exceed the scene's usual motion magnitude.
    tempo_ratio: 2.5
    # MAD-based agreement gate: per-axis std of the player Δs must
    # be ≤ max_spread_ratio × |median Δ|. Larger spread means the
    # players disagree on direction (real motion, not jitter).
    max_spread_ratio: 0.30
    # Residual-consensus pass. Catches sustained wobble (e.g. ~3 Hz
    # camera-tracking oscillation) that the Δ-based pass cannot see:
    # the Δ pass requires per-frame agreement, but on real running
    # scenes per-player frame-to-frame motion (~10 cm/frame sprint)
    # drowns out a 2-5 cm common-mode shift. The residual pass
    # smooths each player's track with a heavy Savgol, then treats
    # the cross-player median residual as the camera bias and
    # subtracts it.
    residual_pass_enabled: true
    # Per-player Savgol window (seconds). 1.2 s is wide enough to
    # absorb running velocity (poly=2 fits a parabolic accel within
    # the window) while leaving short-period wobble in the residual.
    residual_savgol_window_s: 1.2
    residual_savgol_poly: 2
    # Minimum confident players contributing residuals before the
    # cross-player median is trusted. Set lower than the Δ pass
    # because residuals average out individual HMR noise more
    # effectively than raw Δs.
    residual_min_players: 3
    # Floor on the median-residual magnitude before a correction is
    # applied. Keeps the pass from chasing 1-2 cm HMR-noise.
    residual_min_offset_m: 0.02
    # Safety clamp on a single frame's correction.
    residual_max_offset_m: 2.0
    # Iterations of subtract-then-re-fit-baseline. Each iteration
    # cuts the remaining wobble by ~64 % (Savgol leakage ceiling),
    # so 2 passes typically push residual error below the per-
    # player HMR noise floor. >3 buys little.
    residual_iterations: 2
  # Foot-lock finale: runs last, after all smoothing above, so nothing
  # degrades foot placement afterward. Re-pins each stance span to its
  # contact-detected median position with two-bone leg IK, then a
  # penetration guard raises (never lowers) root_t.z so the sole never
  # dips below the pitch plane.
  foot_lock:
    enabled: true
    # Hard clamp on per-joint IK rotation delta (degrees) when solving
    # the stance foot onto its pin; spans that would need more are
    # skipped (reported, not mangled) rather than distorting the leg.
    # Raised from 10 during Wave-4 gberch E2E tuning: the pre-finale
    # track (after cleanup/jitter/residual-consensus smoothing) still
    # carries a few cm of within-span drift the earlier hmr_world-level
    # fix doesn't reach (those passes run downstream of hmr_world and
    # aren't contact-aware); 10 degrees of hip/knee reach wasn't always
    # enough to fully close that gap, leaving spans either skipped or
    # only partially corrected. 25 degrees is still a small fraction of
    # normal gait range of motion and lets the analytic 2-bone IK land
    # exactly on the pin for effectively every gberch span (19/19
    # locked, mean_pin_err_m_after ~1 mm) instead of leaving residual
    # error that shows up as skate in the acceptance-gate metric.
    ik_max_joint_delta_deg: 25.0
    # Hard clamp on the low-passed per-frame root XY/Z micro-correction
    # (m) applied alongside the IK; spans needing more are skipped.
    # Raised from 0.15 alongside ik_max_joint_delta_deg above, same
    # reasoning — max_root_corr_m never exceeded ~0.10 m on gberch even
    # with this much headroom, so 0.4 is a generous ceiling rather than
    # something every span rides up against.
    max_residual_correction_m: 0.4
    # Frames of linear ease-in/ease-out at each stance span edge so the
    # pin doesn't snap on abruptly. Lowered from 3 to 0 during Wave-4
    # gberch E2E tuning: the foot-quality skate metric only measures
    # motion INSIDE a contact span's own frame range, never the
    # transition from outside to inside it — so a hard snap at the
    # span boundary is invisible to the metric, but an eased ramp
    # spends 1+ frames of the ramp INSIDE the span, and that partial-
    # weight blend reads as several tenths of a m/s of "sliding" on
    # gberch's short (5-12 frame) real spans. A future pass that wants
    # visual easing back should measure it against a metric that also
    # accounts for the pre-span position, not just re-enable this blind.
    edge_ease_frames: 0
    # Sole proxy offset (m) below the foot joint used by the
    # penetration guard's ground-clearance check.
    sole_clearance_m: 0.025
    # Foot-landing tolerance (m): if the CLAMPED IK solve still leaves
    # the foot farther than this from its pin anywhere in the span, the
    # whole span is skipped (reported, not mangled) rather than
    # restoring a still-poorly-placed foot. Loosened from the 0.04
    # default during Wave-4 gberch E2E tuning, alongside the joint/root
    # clamp increases above — with those clamps loosened, spans that
    # previously needed skipping now land well inside 0.04 m anyway
    # (mean_pin_err_m_after ~1 mm on gberch); 0.10 is a safety margin
    # for spans the clamps can't quite fully close rather than a value
    # actually being relied on frame to frame.
    skip_pin_err_m: 0.10

export:
  gltf_enabled: true
  fbx_enabled: true
  blender_path: blender
  ue5:
    forward_axis: -Y
    up_axis: Z
    scale: 1.0
  virtual_cameras:
    pov_fov_deg: 75.0
    ots_fov_deg: 60.0
    ots_back_m: 0.4
    ots_up_m: 0.3
    ots_right_m: 0.0
    ball_target_max_occlusion_frames: 10
    drone_fov_deg: 55.0
    drone_height_m: 40.0
    drone_back_m: 25.0
    drone_smooth_frames: 25

render:
  enabled: true
  blender_path: null          # null → fall back to export.blender_path
  cameras: [broadcast, drone] # also accepts pov:<PID>, ots:<PID>
  resolution: [1920, 1080]
  vertical_variant: false     # additionally render 1080x1920 for non-broadcast cams
  samples: 16                 # EEVEE taa_render_samples
  style:
    palette:
      grass_light: "#4d9e46"
      grass_dark: "#3f8a3a"
      lines: "#f5f5f0"
      sky_top: "#9ecfe8"
      sky_bottom: "#e8f4d8"
      outline: "#1a1a1a"
    ramp_steps: 3
    outline_width_m: 0.02
    grass_stripes: 10
  teams:
    defaults:
      home: {shirt: "#c0392b", shorts: "#ffffff", socks: "#c0392b"}
      away: {shirt: "#2980b9", shorts: "#2c3e50", socks: "#2980b9"}
      home_gk: {shirt: "#f1c40f", shorts: "#2c3e50", socks: "#f1c40f"}
      away_gk: {shirt: "#27ae60", shorts: "#2c3e50", socks: "#27ae60"}
      referee: {shirt: "#222222", shorts: "#222222", socks: "#222222"}
      unknown: {shirt: "#888888", shorts: "#666666", socks: "#888888"}
    by_player: {}             # e.g. {P003: away} — overrides the derived kit role
  aov_passes: false
  save_blend: false
