    pitch_length_m: 105.0
    pitch_width_m: 68.0
    mowing:
      orientation: along_touchline
      stripe_width_m: 5.5
      origin_y_m: 0.0

  st_james_park:
    display_name: "St James' Park (Newcastle United)"
    pitch_length_m: 105.0
    pitch_width_m: 68.0
    mowing:
      orientation: along_touchline
      stripe_width_m: 5.5
      origin_y_m: 0.0

  city_ground:
    display_name: "City Ground (Nottingham Forest)"
    # Notably WIDER than the league standard: 105 x 71 m (consistent
    # across the 2025/26 pitch-size lists). The extra 3 m of width
    # matters for the ball stage's y-bounds on crossing plays.
    pitch_length_m: 105.0
    pitch_width_m: 71.0
    mowing:
      orientation: along_touchline
      stripe_width_m: 5.5
      origin_y_m: 0.0

  stadium_of_light:
