# Short 2 - "Would you save this?" (keeper eye-line, floodlit). Replaces
# config/shorts/gberch_keeper.yaml + the s2_* passes of gberch_experiments.yaml.
name: keeper
size: [1080, 1920]
fps: 30
style_name: floodlit
style:
  palette: {sky_top: "#070b16", sky_bottom: "#1d2a44"}
  sun_energy: 2.2
  world_strength: 0.35
  lines_emission_strength: 2.5
  post: {glare: 1.0, vignette: 0.45, saturation: 1.1}

slots:
  - id: goalline_open
    candidates:
      - camera: "goal:@goal_end"
        rig: {goal_height_m: 1.7, goal_back_m: 4.5, goal_fov_deg: 50.0, focus: ball}
        from: strike-69
        to: strike-33
        pad: [2, 12]
      - camera: "goal:@goal_end"
        rig: {goal_height_m: 2.4, goal_back_m: 9.0, goal_fov_deg: 42.0, focus: ball}
        from: strike-69
        to: strike-33
        pad: [2, 12]
  - id: keeper_eyes
    candidates:
      - camera: "eyes:@keeper"
        rig: {eyes_fov_deg: 50.0}
        from: strike-41
        to: strike-9
        pad: [10, 37]
        # a keeper's sight line is legitimately crowded by his own box
        framing: {max_occluded_frames: 30}
        flash: true
        label: KEEPER CAM
        label_style: chip_dark
  - id: keeper_eyes_slow
    candidates:
      - camera: "eyes:@keeper"
        rig: {eyes_fov_deg: 50.0}
        from: strike-9
        to: strike+22
        pad: [0, 7]
        time_stretch: 4
        freeze_at: strike+9
        freeze_s: 1.4
        label: KEEPER CAM
        label_style: chip_dark
  - id: goal_replay
    candidates:
      - camera: "goal:@goal_end"
        rig: {goal_height_m: 1.6, goal_back_m: 6.0, goal_fov_deg: 42.0, focus: ball}
        from: impact-12
        to: impact+18
        pad: [10, 8]
        time_stretch: 2
        hold_s: 1.4

captions:
  - {text: "WOULD YOU SAVE THIS?", style: title, start: 0}
  - {text: "Which way do you dive?", style: sub, over: "keeper_eyes_slow.freeze"}
  - {text: "Save or goal? Comments", style: sub, start: -2.0}
